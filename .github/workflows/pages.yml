name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Checkout repositori Anda
      - uses: actions/checkout@v4

      # 2. Konfigurasi GitHub Pages
      - uses: actions/configure-pages@v5

      # 3. Upload artifact (Diperbarui ke @v3 agar menggunakan Node versi baru)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 4. Deploy ke GitHub Pages (Diperbarui ke @v4)
      - uses: actions/deploy-pages@v4
